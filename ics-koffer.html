<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Was trägst du mit dir? · ICS</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d1b;color:#fffdf8;font:17px/1.6 system-ui,sans-serif;min-height:100svh}main{max-width:680px;margin:auto;padding:22px 20px 40px}header{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;color:#e6bd73}header a,footer a{color:inherit}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.12;margin:12px 0;font-size:clamp(32px,7vw,52px)}h2{font-size:34px}p{color:#e0e3da}button{font:inherit;cursor:pointer;width:100%;padding:15px 18px;border:1px solid #a88a50;border-radius:13px;background:#23332e;color:#fffdf8;text-align:left;margin:6px 0;transition:.2s}button:hover,button:focus-visible{background:#384b40;outline:2px solid #e7c17b}button.primary{background:#e6bd73;color:#17231e;text-align:center;font-weight:700}small,.eyebrow{color:#e6bd73;letter-spacing:2px;font-size:11px;text-transform:uppercase}.scene{position:relative;height:clamp(220px,48vw,340px);overflow:hidden;border-radius:24px;margin:20px 0;background:radial-gradient(ellipse at 50% 38%,#f8d79a 0%,#8d986c 17%,#334e40 42%,#102520 80%);box-shadow:0 15px 50px #0005}.scene svg{width:100%;height:100%}.symbol{position:absolute;left:50%;top:59%;transform:translate(-50%,-50%);font-size:78px;filter:drop-shadow(0 0 24px #ffdc8b);animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translate(-50%,-56%)}}.progress{height:4px;background:#ffffff20;border-radius:8px;margin-top:20px}.progress i{display:block;height:100%;background:#e6bd73;border-radius:8px;transition:width .4s}.panel{animation:appear .5s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.note{border-left:2px solid #e6bd73;padding:8px 16px;margin:20px 0;background:#ffffff08}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #9b8357;border-radius:30px;padding:5px 12px;font-size:14px}footer{text-align:center;font-size:12px;color:#b6bdb0;margin-top:32px}textarea{width:100%;background:#182a24;color:white;border:1px solid #a88a50;border-radius:12px;padding:12px;font:inherit;resize:vertical} @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{body{background:white;color:black}p,.eyebrow,small{color:black}button,header,.scene,footer,.progress{display:none}.chip{color:black}}
</style><main><header><span>INNER CODE SYSTEMS</span><a href="https://www.innercodesystems.com/">ICS ↗</a></header><div class="progress" role="progressbar" aria-label="Reisefortschritt" aria-valuemin="0" aria-valuemax="100"><i></i></div><div class="scene" aria-hidden="true"><svg viewBox="0 0 680 340" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="path" x2="0" y2="1"><stop stop-color="#f6d99a"/><stop offset="1" stop-color="#66543b"/></linearGradient></defs><path d="M330 135 Q420 210 180 340 H510 Q380 220 350 135" fill="url(#path)" opacity=".7"/><g id="trees"></g><g id="stars"></g></svg><div class="symbol" id="symbol">🧳</div></div><section id="panel" class="panel" aria-live="polite"></section><footer>ICS SPIELEWELT · Verstehen. Spüren. Handeln.<br>Ein Spiel zur Selbstreflexion, kein psychologischer Test.<br><a href="https://www.innercodesystems.com/">Zur ICS Website</a></footer></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let trees='',stars='';for(let i=0;i<20;i++){let x=i<10?i*28:430+(i-10)*28,h=110+(i*73%210);trees+=`<path d="M${x-40} 300 L${x} ${300-h} L${x+45} 300Z" fill="${i%2?'#172e28':'#203c32'}" opacity=".85"/><rect x="${x-3}" y="${290}" width="6" height="50" fill="#182b25"/>`}for(let i=0;i<35;i++)stars+=`<circle cx="${(i*97)%680}" cy="${(i*43)%260}" r="${1+i%3*.5}" fill="#ffe4a6" opacity="${.25+i%5*.12}"/>`;$('#trees').innerHTML=trees;$('#stars').innerHTML=stars;
const stages=[
{place:'Die Lichtung',icon:'🪨',item:'Erwartungen',story:'Im Koffer liegt ein schwerer Stein. Auf ihm steht: „Ich muss es allen recht machen.“ Vor dir öffnet sich eine stille Lichtung.',q:'Was möchtest du mit diesem Stein tun?',choices:[['Ich lege ihn ab.','Loslassen','Du darfst freundlich sein, ohne jede Erwartung zu erfüllen.','Erwartungen anderer'],['Ich nehme nur mit, was mir wichtig ist.','Klarheit','Du kannst zwischen deinen Werten und fremden Erwartungen unterscheiden.',''],['Ich behalte ihn vorerst.','Geduld','Auch das ist eine Entscheidung. Du musst heute nichts erzwingen.','']]},
{place:'Die Brücke',icon:'🗝️',item:'Sicherheit',story:'Eine kleine Brücke führt über einen Bach. In deinem Koffer findest du einen Schlüssel. Er steht für den Wunsch, alles vorher zu wissen.',q:'Wie möchtest du die Brücke überqueren?',choices:[['Ich gehe einen kleinen Schritt.','Mut','Mut kann ganz klein beginnen.',''],['Ich prüfe erst, was mich trägt.','Besonnenheit','Sicherheit und Veränderung dürfen zusammengehen.',''],['Ich lasse den Schlüssel hier.','Vertrauen','Nicht jede Frage muss beantwortet sein, bevor du beginnst.','Den Anspruch auf völlige Sicherheit']]},
{place:'Der Garten',icon:'🪞',item:'Selbstbild',story:'Zwischen wilden Blumen steht ein Spiegel. Darauf liest du: „Ich bin erst wertvoll, wenn ich genug leiste.“',q:'Welchen Satz möchtest du mitnehmen?',choices:[['Ich bin wertvoll, auch wenn ich nichts leiste.','Selbstwert','Dein Wert muss nicht verdient werden.','Leistungsdruck'],['Ich darf stolz auf meine Leistung sein und mich ausruhen.','Balance','Leistung und Ruhe dürfen nebeneinander existieren.',''],['Ich möchte erst herausfinden, was ich selbst glaube.','Neugier','Du darfst alte Sätze prüfen, ohne sofort neue glauben zu müssen.','']]},
{place:'Am See',icon:'🍂',item:'Vergangenheit',story:'Am Ufer findest du einen alten Brief. Er erinnert dich an etwas, das du heute nicht mehr ändern kannst.',q:'Was machst du mit dem Brief?',choices:[['Ich lege ihn symbolisch ab.','Freiheit','Erinnerungen dürfen bleiben, ohne jeden nächsten Schritt zu bestimmen.','Eine alte Belastung'],['Ich nehme die Erkenntnis daraus mit.','Weisheit','Du kannst aus Erlebtem lernen, ohne dich darauf zu reduzieren.',''],['Ich bewahre ihn noch auf.','Fürsorge','Du bestimmst selbst, wann du bereit bist.','']]},
{place:'Der Aussichtspunkt',icon:'✨',item:'Deine Richtung',story:'Der Weg wird heller. Vor dir liegen drei kleine goldene Anhänger. Du darfst einen für deine nächste Reise auswählen.',q:'Was möchtest du stärken?',choices:[['Meinen eigenen Weg gehen.','Selbstbestimmung','Deine Richtung darf sich an deinen eigenen Werten orientieren.',''],['Mir mehr Ruhe erlauben.','Ruhe','Auch ein Moment ohne Aufgabe kann wertvoll sein.',''],['Etwas Neues ausprobieren.','Offenheit','Ein kleiner Versuch kann neue Möglichkeiten sichtbar machen.','']]}
];let n=-1,answers=[],reflection=false,entry='',journal='';function show(html,icon,progress){$('#symbol').textContent=icon;$('#panel').innerHTML=html;$('#panel').classList.remove('panel');void $('#panel').offsetWidth;$('#panel').classList.add('panel');$('.progress i').style.width=progress+'%';$('.progress').setAttribute('aria-valuenow',progress)}function btn(t,fn,primary=false){let b=document.createElement('button');b.textContent=t;b.className=primary?'primary':'';b.onclick=fn;$('#panel').append(b)}function start(){n=-1;answers=[];journal='';show('<div class="eyebrow">Ein interaktives Abenteuer · ca. 5–10 Minuten</div><h1>Was trägst du mit dir?</h1><p>Eine Reise zu dir selbst.</p><p>Vor dir liegt ein neuer Weg. Neben dir steht ein alter Koffer. Was darin liegt, hat dich lange begleitet. Heute darfst du entdecken, was du wirklich noch brauchst.</p><p><small>Kein Richtig. Kein Falsch. Dein Tempo.</small></p>','🧳',0);btn('Den Koffer öffnen',()=>{entry='Du öffnest deinen Koffer und schaust hinein.';next()},true);btn('Einfach losgehen',()=>{entry='Du gehst los. Bald lädt dich der Weg zu einer ersten Rast ein.';next()});}function next(){n++;reflection=false;if(n>=stages.length){finish();return}let s=stages[n];show(`<div class="eyebrow">Station ${n+1} von ${stages.length} · ${s.place}</div><h2>${s.item}</h2><p>${n===0?entry+' ':''}${s.story}</p><p><strong>${s.q}</strong></p>`,s.icon,Math.round(n/5*100));s.choices.forEach(c=>btn(c[0],()=>choose(c)));if(n>0)btn('← Vorherige Station',()=>{answers.pop();n-=2;next()})}function choose(c){answers[n]=c;let s=stages[n];show(`<div class="eyebrow">Dein Reisemoment</div><h2>${c[1]}</h2><div class="note">${c[2]}</div><p>Vielleicht magst du einen Moment bei diesem Gedanken bleiben.</p>`,s.icon,Math.round((n+1)/5*100));btn(n===4?'Meinen Reisekoffer entdecken':'Weiterreisen →',next,true);btn('Anders entscheiden',()=>{n--;next()})}function finish(){let dropped=answers.map(a=>a[3]).filter(Boolean);show(`<div class="eyebrow">Dein persönlicher Reisekoffer</div><h1>Dein Weg geht weiter.</h1><p>Diese Qualitäten hast du auf deiner Reise gewählt:</p><div class="chips">${answers.map(a=>`<span class="chip">✦ ${a[1]}</span>`).join('')}</div><h2>Was du zurücklassen möchtest</h2><p>${dropped.length?dropped.map(esc).join(' · '):'Heute hast du nichts ausdrücklich zurückgelassen. Auch das darf sein.'}</p><div class="note">${answers[4][2]}</div><label for="journal">Welchen kleinen Schritt möchtest du in den nächsten 24 Stunden gehen?</label><textarea id="journal" rows="3" placeholder="Mein nächster Schritt …">${esc(journal)}</textarea><p><small>Deine Eingabe bleibt in dieser Sitzung auf deinem Gerät.</small></p>`,'🌅',100);$('#journal').oninput=e=>journal=e.target.value;btn('Meinen Reisekoffer speichern',()=>{let content='ICS – Was trägst du mit dir?\n\nMeine Qualitäten: '+answers.map(a=>a[1]).join(', ')+'\n\nWas ich zurücklassen möchte: '+(dropped.join(', ')||'Nichts ausdrücklich gewählt')+'\n\nMein Impuls: '+answers[4][2]+'\n\nMein nächster Schritt: '+journal;let url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Mein-ICS-Reisekoffer.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},true);btn('Eine neue Reise beginnen',start)}start();</script></html>
